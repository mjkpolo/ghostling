name: Build Rocky GTK client and static musl server

permissions:
  contents: write

concurrency:
  group: rocky-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [gmux-codex]
  workflow_dispatch:

jobs:
  manager:
    name: Qt manager (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime dependencies
        # QtGui links EGL even when tests use the offscreen platform.
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Build and install manager wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m pip install dist/*.whl
          gmux-manager --help
      - name: Test manager
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p test_manager.py -v
          python -m unittest manager.test_ui manager.test_config -v
          python -c 'from gmux_manager.backend import Host; assert Host("test").api.SSH_CONTROL is None'
      - uses: actions/upload-artifact@v4
        with:
          name: gmux-manager-wheel
          path: dist/*.whl

  build:
    needs: manager
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9.4
    steps:
      - name: Install checkout prerequisites
        run: dnf -y install git tar
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build dependencies
        run: >-
          dnf -y install cmake file gcc gcc-c++ git
          gtk4-devel make ncurses python3 tar xz
      - name: Build Rocky client and static musl server
        run: |
          set -o pipefail
          ./ci/build-rocky.sh 2>&1 | tee rocky-build.log
      - name: Report build failure
        if: failure()
        run: |
          message=$(tail -80 rocky-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Rocky build log::$message"
      - uses: actions/download-artifact@v4
        with:
          name: gmux-manager-wheel
          path: artifacts/
      - name: Checksum manager package
        run: cd artifacts && sha256sum *.whl >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gmux-rocky-linux-9.4-x86_64
          path: artifacts/
          if-no-files-found: error
      - name: Publish release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gmux-codex-${{ github.run_number }}
          name: gmux-codex build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/gmux
            artifacts/gmux-server
            artifacts/*.whl
            artifacts/gmux-themes.tar.gz
            artifacts/xterm-ghostty.terminfo
            artifacts/GHOSTTY-LICENSE
            artifacts/SHA256SUMS
            artifacts/VERSION
            artifacts/dependencies.txt
