name: Build Rocky Linux 9.4 binaries

permissions:
  contents: write

concurrency:
  group: rocky-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [gmux-codex]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: rockylinux/rockylinux:9.4
    steps:
      - name: Install checkout prerequisites
        run: dnf -y install git tar
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install build dependencies
        run: >-
          dnf -y install cmake file fontconfig-devel gcc gcc-c++ git
          gtk4-devel make tar xz
      - name: Build client and server
        run: |
          set -o pipefail
          ./ci/build-rocky.sh 2>&1 | tee rocky-build.log
      - name: Report build failure
        if: failure()
        run: |
          message=$(tail -80 rocky-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Rocky build log::$message"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gmux-rocky-linux-9.4-x86_64
          path: artifacts/
          if-no-files-found: error
      - name: Publish release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: gmux-codex-${{ github.run_number }}
          name: gmux-codex build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            artifacts/gmux
            artifacts/gmux-server
            artifacts/gmuxctl
            artifacts/gmux-themes.tar.gz
            artifacts/xterm-kitty.terminfo
            artifacts/KITTY-LICENSE
            artifacts/SHA256SUMS
            artifacts/dependencies.txt
