[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gmux-manager"
version = "0.1.0"
description = "Qt host and session manager for gmux terminals over SSH"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.8,<6.9"]

[project.gui-scripts]
gmux-manager = "gmux_manager.app:main"

[project.urls]
Repository = "https://github.com/mjkpolo/ghostling"

[tool.setuptools]
include-package-data = false
packages = ["gmux_manager"]
package-dir = {gmux_manager = "manager"}

[tool.setuptools.package-data]
gmux_manager = ["assets/*.desktop", "assets/*.svg"]
